name: Build and Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Prepare build metadata
      shell: bash
      run: node prepare.mjs ${{ github.run_number }}

    - name: Build app
      run: pnpm run build-app

    - name: Build Windows executable
      run: pnpm run electron-pack-win
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        APP_VERSION: 0.0.1-alpha.${{ github.run_number }}

    - name: List files in release directory
      shell: powershell
      run: |
        Get-ChildItem -Path "release\" -Recurse -Force

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: local-web-share-windows
        path: |
          release/Local Web Share*.exe
          release/latest.yml
          release/*.blockmap
        retention-days: 30

  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Typecheck
      run: pnpm typecheck || true

    - name: Prepare build metadata
      shell: bash
      run: node prepare.mjs ${{ github.run_number }}

    - name: Build app
      run: pnpm run build-app

    - name: Build macOS DMG
      run: pnpm run electron-pack-mac
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        APP_VERSION: 0.0.1-alpha.${{ github.run_number }}

    - name: List files in release directory
      shell: bash
      run: |
        ls -la release/

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: local-web-share-macos
        path: |
          release/Local Web Share*.dmg
          release/latest-mac.yml
          release/*.blockmap
        retention-days: 30

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: local-web-share-windows
        path: ./release-artifacts/windows/

    - name: Download macOS artifacts
      uses: actions/download-artifact@v4
      with:
        name: local-web-share-macos
        path: ./release-artifacts/macos/

    - name: List artifacts
      run: |
        echo "=== Release artifacts ==="
        ls -la ./release-artifacts/
        echo "=== Windows artifacts ==="
        ls -la ./release-artifacts/windows/
        echo "=== macOS artifacts ==="
        ls -la ./release-artifacts/macos/
        echo "=== Finding exact filenames ==="
        WIN_FILE=$(find ./release-artifacts/windows/ -name "*.exe" -type f | head -n 1)
        WIN_LATEST=$(find ./release-artifacts/windows/ -name "latest.yml" -type f | head -n 1)
        MAC_FILE=$(find ./release-artifacts/macos/ -name "*.dmg" -type f | head -n 1)
        MAC_LATEST=$(find ./release-artifacts/macos/ -name "latest-mac.yml" -type f | head -n 1)
        echo "WIN_FILE=${WIN_FILE}" >> $GITHUB_ENV
        echo "WIN_LATEST=${WIN_LATEST}" >> $GITHUB_ENV
        echo "MAC_FILE=${MAC_FILE}" >> $GITHUB_ENV
        echo "MAC_LATEST=${MAC_LATEST}" >> $GITHUB_ENV
        echo "Windows file: ${WIN_FILE}"
        echo "Windows latest: ${WIN_LATEST}"
        echo "macOS file: ${MAC_FILE}"
        echo "macOS latest: ${MAC_LATEST}"

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v0.0.1-alpha.${{ github.run_number }}
        release_name: Dev Build ${{ github.run_number }}
        body: |
          🚀 **Local Web Share**

          A modern, peer-to-peer file sharing application.

          **Features:**
          - Fast local network file sharing
          - Drag & drop support
          - Secure peer-to-peer transfer
          - Cross-platform support

          **Downloads:**
          - Windows: See attached assets
          - macOS (Apple Silicon): See attached assets

          **Installation:**
          - Download the appropriate file for your platform and run the installer.

          ⚠️ **Note:** This is a development build and may contain bugs or unstable features.
        draft: false
        prerelease: false

    - name: Upload Windows Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.WIN_FILE }}
        asset_name: Local-Web-Share-Setup-0.0.1-alpha.${{ github.run_number }}.exe
        asset_content_type: application/octet-stream

    - name: Upload Windows Setup Blockmap
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.WIN_FILE }}.blockmap
        asset_name: Local-Web-Share-Setup-0.0.1-alpha.${{ github.run_number }}.exe.blockmap
        asset_content_type: application/octet-stream

    - name: Upload Windows Latest YML
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.WIN_LATEST }}
        asset_name: latest.yml
        asset_content_type: application/x-yaml

    - name: Upload macOS Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.MAC_FILE }}
        asset_name: Local-Web-Share-0.0.1-alpha.${{ github.run_number }}.dmg
        asset_content_type: application/octet-stream

    - name: Upload macOS Latest YML
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.MAC_LATEST }}
        asset_name: latest-mac.yml
        asset_content_type: application/x-yaml

    - name: Prepare Release Metadata
      run: |
        mkdir -p release-metadata
        cp ./release-artifacts/windows/latest.yml release-metadata/latest.yml
        cp ./release-artifacts/macos/latest-mac.yml release-metadata/latest-mac.yml
        ls -la release-metadata/

    - name: Deploy Release Info to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./release-metadata
        publish_branch: release-info
        force_orphan: true
